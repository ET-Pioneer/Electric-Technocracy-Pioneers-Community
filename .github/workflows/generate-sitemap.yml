name: "Full Indexing: Repo + Pages + Wiki + Templates"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure .nojekyll exists
        run: echo "" > .nojekyll

      - name: Clone Wiki repository
        run: |
          rm -rf wiki_repo
          git clone https://github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.wiki.git wiki_repo

      - name: Prepare wiki output directory
        run: |
          rm -rf wiki_encyclopedia
          mkdir -p wiki_encyclopedia

      - name: Install Asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Convert Wiki Markdown and AsciiDoc to HTML using template
        run: |
          TEMPLATE="wiki_encyclopedia.html"

          # Process Markdown files
          for file in wiki_repo/*.md; do
            [ -e "$file" ] || continue
            base="$(basename "$file" .md)"
            output="wiki_encyclopedia/${base}.html"

            CONTENT=$(sed 's/$/<br>/' "$file")

            awk -v content="$CONTENT" '
              /<!-- WORKFLOW WILL INSERT WIKI ARTICLE CONTENT HERE -->/ {
                print content
                next
              }
              { print }
            ' "$TEMPLATE" > "$output"
          done

          # Process AsciiDoc files
          for file in wiki_repo/*.adoc; do
            [ -e "$file" ] || continue
            base="$(basename "$file" .adoc)"
            output="wiki_encyclopedia/${base}.html"

            asciidoctor -o temp_adoc.html "$file"
            CONTENT=$(sed 's/$/<br>/' temp_adoc.html)

            awk -v content="$CONTENT" '
              /<!-- WORKFLOW WILL INSERT WIKI ARTICLE CONTENT HERE -->/ {
                print content
                next
              }
              { print }
            ' "$TEMPLATE" > "$output"
          done

      - name: Generate directory listing using template
        run: |
          TEMPLATE="directory.html"
          OUTPUT="directory.html"

          FILELIST=$(find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./wiki_repo/*" \
            | sed 's/^.\///' | sort)

          awk -v content="$FILELIST" '
            /<!-- WORKFLOW WILL INSERT DIRECTORY CONTENT HERE -->/ {
              print content
              next
            }
            { print }
          ' "$TEMPLATE" > "$OUTPUT"

      - name: Generate sitemap.xml
        run: |
          BASE_URL="https://et-pioneer.github.io/Electric-Technocracy-Pioneers-Community"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./wiki_repo/*" \
            | while read file; do
                clean="${file#./}"
                url="$BASE_URL/$clean"
                lastmod=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                echo "<url><loc>$url</loc><lastmod>$lastmod</lastmod></url>" >> sitemap.xml
              done

          echo '</urlset>' >> sitemap.xml

      - name: Commit and push generated files
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sitemap.xml directory.html wiki_encyclopedia .nojekyll
          git commit -m "Automated index update (Repo + Wiki + Templates + Sitemap)" || echo "No changes to commit"
          git push https://$TOKEN@github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.git HEAD:main
