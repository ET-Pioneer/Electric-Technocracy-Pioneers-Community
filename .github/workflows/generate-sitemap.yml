name: "Full Indexing: Render ALL Wiki Formats"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ensure .nojekyll exists
        run: echo "" > .nojekyll

      - name: Prepare wiki output directory
        run: |
          rm -rf wiki_encyclopedia
          mkdir -p wiki_encyclopedia

      # 🔥 TEMPORÄRES KLONEN DES WIKIS (NICHT dauerhaft, KEIN Submodul)
      - name: Clone Wiki temporarily
        run: |
          git clone --depth=1 https://github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.wiki.git wiki_temp

      - name: Install converters (Pandoc + Asciidoctor)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pandoc asciidoctor

      - name: Convert ALL local formats to HTML using template
        run: |
          TEMPLATE="wiki_encyclopedia.html"
          EXTENSIONS="md mediawiki creole org rst textile pod rdoc txt adoc"

          for ext in $EXTENSIONS; do
            shopt -s nullglob
            # 🔥 WICHTIG: Wiki-Dateien aus wiki_temp lesen
            for file in wiki_temp/*.$ext; do
              base="${file##*/}"
              base="${base%.$ext}"
              output="wiki_encyclopedia/${base}.html"

              case "$ext" in
                adoc) asciidoctor -o temp.html "$file" ;;
                md) pandoc "$file" -f markdown -t html -o temp.html ;;
                mediawiki) pandoc "$file" -f mediawiki -t html -o temp.html ;;
                creole) pandoc "$file" -f creole -t html -o temp.html ;;
                org) pandoc "$file" -f org -t html -o temp.html ;;
                rst) pandoc "$file" -f rst -t html -o temp.html ;;
                textile) pandoc "$file" -f textile -t html -o temp.html ;;
                pod) pandoc "$file" -f pod -t html -o temp.html ;;
                rdoc) pandoc "$file" -f rdoc -t html -o temp.html ;;
                txt) pandoc "$file" -f markdown -t html -o temp.html ;;
              esac

              awk -v content="$(cat temp.html)" '
                /<!-- WORKFLOW WILL INSERT WIKI ARTICLE CONTENT HERE -->/ {
                  print content
                  next
                }
                { print }
              ' "$TEMPLATE" > "$output"
            done
            shopt -u nullglob
          done

      # 🔥 TEMPORÄRES WIKI WIRD WIEDER GELÖSCHT
      - name: Cleanup temporary wiki
        run: rm -rf wiki_temp

      - name: Generate directory listing using template
        run: |
          TEMPLATE="directory.html"
          OUTPUT="directory.html"

          FILELIST=$(find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            | sed 's|^\./||' | sort)

          awk -v content="$FILELIST" '
            /<!-- WORKFLOW WILL INSERT DIRECTORY CONTENT HERE -->/ {
              print content
              next
            }
            { print }
          ' "$TEMPLATE" > "$OUTPUT"

      - name: Generate sitemap.xml
        run: |
          BASE_URL="https://et-pioneer.github.io/Electric-Technocracy-Pioneers-Community"

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          } > sitemap.xml

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            | while read file; do
                clean="${file#./}"
                url="$BASE_URL/$clean"
                esc_url=$(printf '%s' "$url" | sed 's/&/\&amp;/g; s/</\&lt;/g')
                lastmod=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                echo "<url><loc>$esc_url</loc><lastmod>$lastmod</lastmod></url>" >> sitemap.xml
              done

          echo '</urlset>' >> sitemap.xml

      - name: Commit and push generated files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add .
          git commit -m "Automated full wiki indexing" || echo "No changes to commit"
          git push
