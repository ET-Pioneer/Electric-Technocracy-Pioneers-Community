name: Generate Full Index and Sitemap (Grouped)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ensure .nojekyll exists
      run: |
        echo "" > .nojekyll

    - name: Generate grouped index_files.html and sitemap.xml
      run: |
        BASE_URL="https://et-pioneer.github.io/Electric-Technocracy-Pioneers-Community"

        echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
        echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

        echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Repository File Index</title></head><body>' > index_files.html
        echo '<h1>Repository File Index (Grouped by Folder)</h1>' >> index_files.html

        mapfile -t files < <(find . -type f ! -path "./.git/*" | sort)

        current_dir=""

        for file in "${files[@]}"; do
          clean="${file#./}"
          dir="$(dirname "$clean")"
          url="$BASE_URL/$clean"

          if [[ "$dir" != "$current_dir" ]]; then
            if [[ -n "$current_dir" ]]; then
              echo "</ul>" >> index_files.html
            fi
            echo "<h2>$dir</h2><ul>" >> index_files.html
            current_dir="$dir"
          fi

          echo "<li><a href=\"$url\">$clean</a></li>" >> index_files.html
          echo "<url><loc>$url</loc></url>" >> sitemap.xml
        done

        echo "</ul></body></html>" >> index_files.html
        echo "</urlset>" >> sitemap.xml

    - name: Commit and push generated files
      env:
        TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add sitemap.xml index_files.html .nojekyll
        git commit -m "Auto-update grouped sitemap and index" || echo "No changes to commit"
        git push https://$TOKEN@github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.git HEAD:main
