name: "Full Indexing: Render ALL Wiki Formats"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure .nojekyll exists
        run: echo "" > .nojekyll

      - name: Clone Wiki repository
        run: |
          rm -rf wiki_repo
          git clone https://github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.wiki.git wiki_repo

      - name: Prepare wiki output directory
        run: |
          rm -rf wiki_encyclopedia
          mkdir -p wiki_encyclopedia

      - name: Install converters (Pandoc + Asciidoctor)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc asciidoctor

      - name: Convert ALL Wiki formats to HTML using template
        run: |
          TEMPLATE="wiki_encyclopedia.html"

          # Supported extensions
          EXTENSIONS="md adoc mediawiki creole org rst textile pod rdoc txt"

          for ext in $EXTENSIONS; do
            for file in wiki_repo/*.$ext; do
              [ -e "$file" ] || continue

              base="$(basename "$file" .$ext)"
              output="wiki_encyclopedia/${base}.html"

              # Convert based on type
              case "$ext" in
                adoc)
                  asciidoctor -o temp.html "$file"
                  ;;
                *)
                  pandoc "$file" -f $ext -t html -o temp.html
                  ;;
              esac

              CONTENT=$(sed 's/$/<br>/' temp.html)

              awk -v content="$CONTENT" '
                /<!-- WORKFLOW WILL INSERT WIKI ARTICLE CONTENT HERE -->/ {
                  print content
                  next
                }
                { print }
              ' "$TEMPLATE" > "$output"
            done
          done

      - name: Generate directory listing using template
        run: |
          TEMPLATE="directory.html"
          OUTPUT="directory.html"

          FILELIST=$(find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./wiki_repo/*" \
            | sed 's/^.\///' | sort)

          awk -v content="$FILELIST" '
            /<!-- WORKFLOW WILL INSERT DIRECTORY CONTENT HERE -->/ {
              print content
              next
            }
            { print }
          ' "$TEMPLATE" > "$OUTPUT"

      - name: Generate sitemap.xml
        run: |
          BASE_URL="https://et-pioneer.github.io/Electric-Technocracy-Pioneers-Community"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          find . -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            ! -path "./wiki_repo/*" \
            | while read file; do
                clean="${file#./}"
                url="$BASE_URL/$clean"
                lastmod=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                echo "<url><loc>$url</loc><lastmod>$lastmod</lastmod></url>" >> sitemap.xml
              done

          echo '</urlset>' >> sitemap.xml

      - name: Commit and push generated files
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sitemap.xml directory.html wiki_encyclopedia .nojekyll
          git commit -m "Automated index update (ALL Wiki Formats Rendered)" || echo "No changes to commit"
          git push https://$TOKEN@github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.git HEAD:main
