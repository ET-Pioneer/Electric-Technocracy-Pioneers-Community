name: Full Indexing: Repo + Pages + Wiki + Search

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Ensure .nojekyll exists
      run: echo "" > .nojekyll

    # Wiki klonen → dauerhaft in /wiki
    - name: Clone Wiki repository permanently into /wiki
      run: |
        rm -rf wiki
        mkdir -p wiki
        git clone https://github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.wiki.git wiki_tmp
        cp -a wiki_tmp/*.md wiki/ || echo "No .md files found in wiki"
        rm -rf wiki_tmp

    # Pandoc installieren für echtes Markdown → HTML
    - name: Install pandoc for real Markdown → HTML rendering
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    # Wiki-Markdown zu echtem HTML rendern
    - name: Render Wiki Markdown to real HTML
      run: |
        rm -rf wiki_html
        mkdir -p wiki_html

        META_DESC="Electric Technocracy Community exploring AI governance, AGI safety, UBI, longevity, post-scarcity systems, and future-ready societal models."
        META_KEYS="Electric Technocracy, AI governance, AGI safety, UBI, Longevity, Post-scarcity, Futurism, Decentralized governance, Ethical AI, AI alignment, Digital democracy, Technocratic systems, AI policy, Sustainable innovation, Transhumanism, Life extension, Community governance, AI-driven society, Future civilization, Open-source governance, Collective intelligence, AI ethics, Automation economy, Universal basic income, Post-labor society, AI research community, Next-gen governance, Societal transformation, Tech-enabled democracy, Global coordination"

        for file in wiki/*.md; do
          [ -e "$file" ] || continue
          base="$(basename "$file" .md)"
          out="wiki_html/${base}.html"

          pandoc "$file" -f markdown -t html5 -s \
            -M title="Electric Technocracy Wiki – ${base}" \
            -M description="${META_DESC}" \
            -M keywords="${META_KEYS}" \
            -o "$out"
        done

    # SEO-optimierte index_files.html generieren
    - name: Generate SEO-optimized index_files.html
      run: |
        BASE_URL="https://et-pioneer.github.io/Electric-Technocracy-Pioneers-Community"

        cat > index_files.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electric Technocracy Community – Global Knowledge & File Index</title>
<meta name="description" content="Global index of Electric Technocracy Community resources: governance research, AI, UBI, post-scarcity, wiki, PDFs, and more.">
<meta name="keywords" content="Electric Technocracy, AI governance, AGI safety, UBI, Longevity, Post-scarcity, Futurism, Decentralized governance, Ethical AI, AI alignment, Digital democracy, Technocratic systems, AI policy, Sustainable innovation, Transhumanism, Life extension, Community governance, AI-driven society, Future civilization, Open-source governance, Collective intelligence, AI ethics, Automation economy, Universal basic income, Post-labor society, AI research community, Next-gen governance, Societal transformation, Tech-enabled democracy, Global coordination">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Electric Technocracy Community – Global Knowledge & File Index">
<meta property="og:description" content="Explore all public resources of the Electric Technocracy Community: wiki, PDFs, research, and governance models.">
<meta property="og:type" content="website">
<style>
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; line-height: 1.5; }
header { margin-bottom: 24px; }
h1 { margin: 0 0 8px 0; font-size: 1.8rem; }
h2 { margin-top: 32px; font-size: 1.4rem; }
h3 { margin-top: 20px; font-size: 1.1rem; }
#searchBox { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; margin: 12px 0 20px 0; }
section { margin-bottom: 24px; }
ul { padding-left: 20px; }
li { margin: 2px 0; }
.badge { display: inline-block; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; background: #eee; margin-left: 6px; }
.category { font-size: 0.85rem; color: #666; }
@media (max-width: 600px) {
  body { margin: 10px; }
  h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<header>
  <h1>Electric Technocracy Community – Global File & Wiki Index</h1>
  <p class="category">Unified index of repository files, wiki pages, PDFs, and rendered knowledge artifacts.</p>
  <input type="text" id="searchBox" placeholder="Search files, wiki pages, PDFs, topics…">
</header>

<section id="repo-section">
  <h2>Repository HTML & Core Files</h2>
  <div id="repo-list">
EOF

        # Repository HTML & core files
        mapfile -t files < <(find . -type f \( -name "*.html" -o -name "*.md" -o -name "*.pdf" \) ! -path "./.git/*" ! -path "./.github/*" ! -path "./wiki/*" ! -path "./wiki_html/*" | sort)

        current_dir=""

        for file in "${files[@]}"; do
          clean="${file#./}"
          dir="$(dirname "$clean")"
          url="$BASE_URL/$clean"

          if [[ "$dir" != "$current_dir" ]]; then
            if [[ -n "$current_dir" ]]; then echo "</ul>" >> index_files.html; fi
            echo "<h3>$dir</h3><ul>" >> index_files.html
            current_dir="$dir"
          fi

          label=""
          case "$clean" in
            *.html) label="HTML";;
            *.md) label="Markdown";;
            *.pdf) label="PDF";;
          esac

          echo "<li><a href=\"$url\">$clean</a> <span class=\"badge\">$label</span></li>" >> index_files.html
        done

        if [[ -n "$current_dir" ]]; then
          echo "</ul>" >> index_files.html
        fi

        # Wiki HTML section
        echo '</div></section>' >> index_files.html
        echo '<section id="wiki-html-section"><h2>Wiki Pages (Rendered HTML)</h2><ul>' >> index_files.html

        if [ -d "wiki_html" ]; then
          while IFS= read -r file; do
            clean="${file#./}"
            url="$BASE_URL/$clean"
            echo "<li><a href=\"$url\">${clean#wiki_html/}</a> <span class=\"badge\">Wiki HTML</span></li>" >> index_files.html
          done < <(find wiki_html -type f -name "*.html" | sort)
        fi

        echo '</ul></section>' >> index_files.html

        # Wiki Markdown section
        echo '<section id="wiki-md-section"><h2>Wiki Source (Markdown)</h2><ul>' >> index_files.html

        if [ -d "wiki" ]; then
          while IFS= read -r file; do
            clean="${file#./}"
            url="$BASE_URL/$clean"
            echo "<li><a href=\"$url\">${clean#wiki/}</a> <span class=\"badge\">Wiki MD</span></li>" >> index_files.html
          done < <(find wiki -type f -name "*.md" | sort)
        fi

        echo '</ul></section>' >> index_files.html

        cat >> index_files.html << 'EOF'
<script>
document.getElementById("searchBox").addEventListener("input", function () {
    const q = this.value.toLowerCase();
    document.querySelectorAll("section").forEach(section => {
        let visibleSection = false;
        const lists = section.querySelectorAll("ul");
        lists.forEach(list => {
            let visibleList = false;
            list.querySelectorAll("li").forEach(item => {
                const match = item.textContent.toLowerCase().includes(q);
                item.style.display = match ? "" : "none";
                if (match) visibleList = true;
            });
            list.style.display = visibleList ? "" : "none";
            if (visibleList) visibleSection = true;
        });
        section.style.display = visibleSection || q === "" ? "" : "none";
    });
});
</script>
</body>
</html>
EOF

    # Sitemaps: Index + getrennte Sitemaps
    - name: Generate Google-compatible sitemaps (HTML + PDF + MD + Wiki)
      run: |
        BASE_URL="https://et-pioneer.github.io/Electric-Technocracy-Pioneers-Community"

        rm -f sitemap.xml sitemap_html.xml sitemap_pdf.xml sitemap_md.xml sitemap_wiki_html.xml

        generate_sitemap () {
          filename="$1"
          shift
          files=("$@")

          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$filename"
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> "$filename"

          for file in "${files[@]}"; do
            clean="${file#./}"

            if [[ "$clean" == *.md ]]; then
              base="${clean%.md}"
              url="$BASE_URL/$base"
            else
              url="$BASE_URL/$clean"
            fi

            lastmod=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            cat >> "$filename" <<EOF
<url>
  <loc>$url</loc>
  <lastmod>$lastmod</lastmod>
  <changefreq>weekly</changefreq>
  <priority>0.8</priority>
</url>
EOF
          done

          echo '</urlset>' >> "$filename"
        }

        mapfile -t html_files < <(find . -type f -name "*.html" ! -path "./.git/*" ! -path "./.github/*" | sort)
        mapfile -t pdf_files < <(find . -type f -name "*.pdf" ! -path "./.git/*" ! -path "./.github/*" | sort)
        mapfile -t md_files < <(find . -type f -name "*.md" ! -path "./.git/*" ! -path "./.github/*" | sort)
        mapfile -t wiki_html_files < <(find wiki_html -type f -name "*.html" | sort)

        generate_sitemap sitemap_html.xml "${html_files[@]}"
        generate_sitemap sitemap_pdf.xml "${pdf_files[@]}"
        generate_sitemap sitemap_md.xml "${md_files[@]}"
        generate_sitemap sitemap_wiki_html.xml "${wiki_html_files[@]}"

        echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
        echo '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

        for sm in sitemap_html.xml sitemap_pdf.xml sitemap_md.xml sitemap_wiki_html.xml; do
          lastmod=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "<sitemap><loc>$BASE_URL/$sm</loc><lastmod>$lastmod</lastmod></sitemap>" >> sitemap.xml
        done

        echo '</sitemapindex>' >> sitemap.xml

    - name: Commit and push generated files
      env:
        TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add sitemap.xml sitemap_html.xml sitemap_pdf.xml sitemap_md.xml sitemap_wiki_html.xml index_files.html wiki wiki_html .nojekyll
        git commit -m "Full auto-index update (Repo + Wiki + Sitemaps + SEO index)" || echo "No changes to commit"
        git push https://$TOKEN@github.com/ET-Pioneer/Electric-Technocracy-Pioneers-Community.git HEAD:main
