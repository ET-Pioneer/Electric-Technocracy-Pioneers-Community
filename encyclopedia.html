<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electric Technocracy Encyclopedia – Index</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Electric Technocracy Encyclopedia – structured index of all One World wiki articles rendered into HTML.">
<meta name="keywords" content="Electric Technocracy, Encyclopedia, One World, Wiki, Global Governance, Technocracy, Open Knowledge">
<meta name="author" content="Electric Technocracy Pioneers Community">
<link rel="canonical" href="https://mranonymousnwo.github.io/One_World/encyclopedia.html">

<!-- Markdown Renderer -->
<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>

<style>
/* -------------------- GLOBAL -------------------- */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #f5f5f5;
    color: #222;
    display: flex;
}

/* -------------------- SIDEBAR -------------------- */
#sidebar {
    width: 260px;
    background: #111;
    color: #fff;
    height: 100vh;
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
    padding: 20px;
    box-sizing: border-box;
}

#sidebar h2 {
    font-size: 1.2rem;
    margin-top: 0;
}

#sidebar a {
    display: block;
    color: #fff;
    text-decoration: none;
    padding: 6px 0;
    opacity: 0.85;
    font-size: 0.9rem;
}
#sidebar a:hover {
    opacity: 1;
}

/* -------------------- MOBILE SIDEBAR -------------------- */
#mobile-toggle {
    display: none;
    position: fixed;
    top: 15px;
    left: 15px;
    background: #111;
    color: #fff;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    z-index: 999;
}

@media (max-width: 900px) {
    #sidebar {
        transform: translateX(-100%);
        transition: 0.3s;
    }
    #sidebar.open {
        transform: translateX(0);
    }
    #mobile-toggle {
        display: block;
    }
}

/* -------------------- MAIN CONTENT -------------------- */
#content {
    margin-left: 260px;
    padding: 30px;
    max-width: 900px;
}

@media (max-width: 900px) {
    #content {
        margin-left: 0;
        padding: 20px;
    }
}

/* -------------------- HEADER -------------------- */
header {
    background: #0f0f0f;
    color: #fff;
    padding: 25px;
    border-radius: 10px;
}
header h1 {
    margin: 0;
    font-size: 2rem;
}
header p {
    opacity: 0.8;
}

/* -------------------- BUTTON BAR -------------------- */
.button-bar {
    margin: 20px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.button-bar a {
    background: #222;
    color: #fff;
    padding: 10px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.9rem;
}
.button-bar a:hover {
    background: #444;
}

/* -------------------- ARTICLE -------------------- */
article {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.05);
    margin-top: 25px;
}

/* -------------------- FOOTER -------------------- */
footer {
    margin-top: 40px;
    padding: 20px;
    background: #0f0f0f;
    color: #fff;
    text-align: center;
    border-radius: 10px;
}
</style>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
}

document.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.getElementById("sidebar-links");
    const article = document.querySelector("article");

    // GitHub API: list files in docs/wiki_encyclopedia
    const api = "https://api.github.com/repos/MrAnonymousNWO/One_World/contents/docs/wiki_encyclopedia";

    fetch(api)
        .then(r => r.json())
        .then(files => {
            const mdFiles = files.filter(f => f.name.endsWith(".md"));
            mdFiles.sort((a, b) => a.name.localeCompare(b.name));

            // Sidebar + click handler
            mdFiles.forEach(f => {
                const base = f.name.replace(".md", "");
                const label = base.replace(/_/g, " ");

                const link = document.createElement("a");
                link.href = "#";
                link.textContent = label;

                link.onclick = () => loadArticle(base);

                sidebar.appendChild(link);
            });

            // Load default article
            loadArticle("Home");
        });
});

// Load and render Markdown
function loadArticle(name) {
    const article = document.querySelector("article");
    const url = `https://raw.githubusercontent.com/MrAnonymousNWO/One_World/main/docs/wiki_encyclopedia/${name}.md`;

    fetch(url)
        .then(r => r.text())
        .then(md => {
            const converter = new showdown.Converter({
                tables: true,
                ghCompatibleHeaderId: true,
                simplifiedAutoLink: true,
                strikethrough: true,
                tasklists: true
            });

            article.innerHTML = converter.makeHtml(md);
        })
        .catch(() => {
            article.innerHTML = "<p style='color:red'>Article not found.</p>";
        });
}
</script>

</head>
<body>

<div id="mobile-toggle" onclick="toggleSidebar()">☰ Menu</div>

<!-- SIDEBAR -->
<div id="sidebar">
    <h2>📚 All Wiki Articles</h2>
    <div id="sidebar-links"></div>
</div>

<!-- MAIN CONTENT -->
<div id="content">

<header>
    <h1>Electric Technocracy Encyclopedia</h1>
    <p>Structured knowledge for a transparent, data‑driven, future‑ready civilization</p>
</header>

<div class="button-bar">
    <a href="https://mranonymousnwo.github.io/One_World/">🌎 One World Archive</a>
    <a href="https://github.com/MrAnonymousNWO/One_World/wiki">🌍 One World Wiki</a>
</div>

<article>
Loading…
</article>

<footer>
    Electric Technocracy Pioneers Community — Open Knowledge for Global Accessibility
</footer>

</div>
</body>
</html>
