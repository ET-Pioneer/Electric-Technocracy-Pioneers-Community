<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Electric Technocracy Encyclopedia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg-body: #05060a;
      --bg-surface: #0c0f18;
      --bg-surface-alt: #111624;
      --border-subtle: #252a3a;
      --accent: #4fd1c5;
      --accent-soft: rgba(79, 209, 197, 0.12);
      --text-main: #f5f7ff;
      --text-muted: #a0aec0;
      --text-soft: #7b8499;
      --radius-md: 10px;
      --radius-lg: 16px;
      --max-width: 1200px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-body);
      color: var(--text-main);
      font-family: system-ui, sans-serif;
    }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      background: #05060a;
      border-bottom: 1px solid rgba(79, 209, 197, 0.25);
      padding: 1rem;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-home {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-right: 1rem;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .hamburger {
      font-size: 1.6rem;
      cursor: pointer;
      user-select: none;
    }

    /* HAMBURGER MENU */
    .menu-panel {
      position: fixed;
      top: 0;
      right: -350px;
      width: 350px;
      height: 100vh;
      background: #0c0f18;
      border-left: 1px solid var(--border-subtle);
      padding: 1.5rem;
      overflow-y: auto;
      transition: right 0.3s ease;
      z-index: 2000;
    }

    .menu-panel.open { right: 0; }

    .menu-title {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .menu-list a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.4rem;
      display: block;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .menu-list a:hover {
      background: rgba(79, 209, 197, 0.15);
      color: var(--text-main);
    }

    /* LAYOUT */
    .page-shell {
      max-width: var(--max-width);
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .page-shell {
        grid-template-columns: 1fr;
      }
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1rem;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-soft);
      margin-bottom: 0.5rem;
    }

    .sidebar-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .sidebar-list a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem;
      border-radius: 6px;
      display: block;
      transition: background 0.2s;
    }

    .sidebar-list a:hover {
      background: rgba(79, 209, 197, 0.15);
      color: var(--text-main);
    }

    .is-active {
      background: var(--accent-soft);
      color: var(--accent) !important;
    }

    /* CONTENT */
    .content {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      line-height: 1.7;
    }

    .content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 1.5rem 0;
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    /* FOOTER */
    .site-footer {
      max-width: var(--max-width);
      margin: 2rem auto;
      padding: 0 1rem;
      text-align: center;
      color: var(--text-soft);
    }

    .footer-links {
      margin-top: 1rem;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent-soft);
      transition: background 0.2s;
    }

    .footer-links a:hover {
      background: rgba(79, 209, 197, 0.25);
    }
  </style>

  <script>
    function toggleMenu() {
      document.querySelector(".menu-panel").classList.toggle("open");
    }
  </script>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div style="display:flex;align-items:center;gap:1rem;">
      <a href="/Electric-Technocracy-Pioneers-Community/index.html" class="back-home">⬅ Home</a>
      <div class="logo">Electric Technocracy Encyclopedia</div>
    </div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
  </header>

  <!-- HAMBURGER MENU (EXTERNAL LINKS – optional, vom Workflow befüllbar) -->
  <aside class="menu-panel">
    <div class="menu-title">External Links</div>
    <ul class="menu-list">
      <!-- Hier kannst du statisch oder per Workflow deine externen Links einfügen -->
    </ul>
  </aside>

  <!-- PAGE LAYOUT -->
  <main class="page-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-title">Wiki Articles</div>
      <ul class="sidebar-list" id="wikiSidebar"></ul>
    </aside>

    <!-- CONTENT (WORKFLOW SETZT HIER DEN ARTIKEL EIN) -->
    <section class="content" id="articleContent">
      <!-- WORKFLOW WILL INSERT WIKI ARTICLE CONTENT HERE -->
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div>Electric Technocracy Pioneers Community</div>
    <div class="footer-links">
      <a href="all_links.html">📚 All Links</a>
    </div>
  </footer>

  <!-- DYNAMIC SIDEBAR: H1-TITEL AUS ALLEN WIKI-HTML-SEITEN -->
  <script>
    // Alle Wiki-HTML-Dateien im Ordner wiki_encyclopedia
    const wikiFiles = [
      "Home.html",
      "Juridical-Singularity.html",
      "Implementation-Roadmap.html",
      "Technology-Stack.html",
      "all_links.html"
    ];

    const sidebar = document.getElementById("wikiSidebar");

    // Verzeichnis-Pfad dynamisch aus der aktuellen URL ableiten
    // z.B. /Electric-Technocracy-Pioneers-Community/wiki_encyclopedia/
    const dirPath = location.pathname.replace(/[^\/]+$/, "");

    const currentFile = location.pathname.split("/").pop();

    wikiFiles.forEach(file => {
      const url = dirPath + file;

      fetch(url)
        .then(res => res.ok ? res.text() : "")
        .then(html => {
          if (!html) return;
          const doc = new DOMParser().parseFromString(html, "text/html");
          const h1 = doc.querySelector("h1");
          const title = h1 ? h1.textContent.trim() : file.replace(".html", "");
          const active = (file === currentFile) ? "is-active" : "";
          sidebar.innerHTML += `<li><a href="${file}" class="${active}">${title}</a></li>`;
        })
        .catch(err => console.log("Fehler beim Laden:", url, err));
    });
  </script>

</body>
</html>
